name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许手动在 Actions 页面触发部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 显式 install + build：避免 withastro/action 内部重复 upload artifact 触发 409
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 项目要求 Node ≥ 22.12.0（见 package.json engines）
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 首次部署到 GitHub Pages 之前，请在仓库 Settings → Pages →
      # Build and deployment → Source 选择 "GitHub Actions"，否则
      # actions/configure-pages 会因为 Pages 站点尚未创建而失败：
      #   "Get Pages site failed. Not Found"
      #   "Create Pages site failed. Resource not accessible by integration"
      # 启用一次之后，后续部署不再需要额外操作。
      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
