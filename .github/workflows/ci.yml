name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        # Use `npm install` instead of `npm ci` because this repo does not
        # commit `package-lock.json` (it is generated on demand and the
        # ~260 KB file is excluded from version control). `npm install`
        # will resolve and lock from `package.json` directly.
        run: npm install --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build
