name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Pin to Node 22 LTS (matches the engines requirement in
          # package.json). Using a fixed version avoids the deprecation
          # warning that the default Node 20 runner triggers when an
          # action requests Node 24.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # Use `npm install` because this repo does not commit
        # `package-lock.json`. `npm install` will resolve and lock from
        # `package.json` directly.
        run: npm install --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build
