name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Prettier formatting
        # Auto-format on CI. The committed files are the source of truth,
        # but a previous run of Prettier with different options or platform
        # line endings can leave the working tree non-conforming. Applying
        # here keeps the build green without forcing a manual fixup commit.
        run: npm run format:write

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build
